<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shoe</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/"
            }
        }
    </script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background: #f0f0f0;
        }
        .hero-header {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        #three-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: block;
            border-radius: 8px;
        }
        .hero-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            z-index: -1;
            text-align: center;
        }
        h1 {
            font-size: 25vw;
            font-family: monospace;
            line-height: 80%;
            color: grey;
        }
        #model-selector, #hdr-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            padding: 10px 15px;
            font-size: 16px;
            font-family: monospace;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
        }
        #model-selector:hover, #hdr-selector:hover {
            background: rgba(255, 255, 255, 1);
        }
        #hdr-selector {
            top: 70px;
        }
        #controls-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }
        .controls-panel {
            padding: 15px 20px;
            font-family: monospace;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #333;
            border-radius: 8px;
            min-width: 220px;
        }
        .controls-panel h3 {
            margin: 0 0 15px 0;
            font-size: 16px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .control-group {
            margin-bottom: 12px;
        }
        .control-group label {
            display: block;
            margin-bottom: 4px;
            color: #333;
        }
        .control-group input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .control-group input[type="color"] {
            width: 100%;
            height: 30px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
        }
        .control-value {
            float: right;
            font-weight: bold;
        }
        .delete-light-btn {
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 12px;
            font-family: monospace;
        }
        .delete-light-btn:hover {
            background: #cc0000;
        }
        #add-light-btn {
            padding: 10px 15px;
            font-size: 14px;
            font-family: monospace;
            background: #4CAF50;
            color: white;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
            width: fit-content;
        }
        #add-light-btn:hover {
            background: #45a049;
        }
        .drag-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(76, 175, 80, 0.3);
            border: 4px dashed #4CAF50;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .drag-overlay.active {
            opacity: 1;
        }
        .drag-overlay-text {
            font-family: monospace;
            font-size: 24px;
            color: #333;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px 40px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <header class="hero-header">
        <select id="model-selector"></select>
        <select id="hdr-selector"></select>
        <div id="controls-container">
            <div class="controls-panel" id="view-controls">
                <h3>View</h3>
                <div class="control-group">
                    <label>Zoom <span class="control-value" id="zoom-value">4.0</span></label>
                    <input type="range" id="zoom-slider" min="1" max="6" step="0.1" value="4">
                </div>
                <div class="control-group">
                    <label>FOV <span class="control-value" id="fov-value">45</span>°</label>
                    <input type="range" id="fov-slider" min="20" max="100" step="1" value="45">
                </div>
                <div class="control-group">
                    <label>Exposure <span class="control-value" id="exposure-value">1.0</span></label>
                    <input type="range" id="exposure-slider" min="0.3" max="2.0" step="0.05" value="1.0">
                </div>
                <div class="control-group">
                    <label>SSAO <span class="control-value" id="ssao-value">0.5</span></label>
                    <input type="range" id="ssao-slider" min="0" max="2" step="0.1" value="0.5">
                    <label style="margin-top: 4px; display: flex; align-items: center; gap: 6px;">
                        <input type="checkbox" id="ssao-debug"> Show SSAO only
                    </label>
                </div>
                <div class="control-group">
                    <label>Film Grain <span class="control-value" id="grain-value">0.04</span></label>
                    <input type="range" id="grain-slider" min="0" max="0.15" step="0.005" value="0.04">
                </div>
                <!-- <div class="control-group">
                    <label>Shadow Opacity <span class="control-value" id="shadow-value">0.7</span></label>
                    <input type="range" id="shadow-slider" min="0" max="1" step="0.05" value="0.7">
                </div> -->
            </div>
            <div class="controls-panel" id="orb-controls">
                <h3>Background</h3>
                <div class="control-group">
                    <label>Style</label>
                    <select id="orb-texture-selector" style="width: 100%; padding: 5px; font-family: monospace; border: 1px solid #333; border-radius: 4px;">
                        <option value="">None</option>
                        <option value="studio" selected>Studio</option>
                        <option value="studio-inv">Studio Inverted</option>
                        <option value="spotlight">Spotlight</option>
                        <option value="spotlight-warm">Spotlight Warm</option>
                        <option value="spotlight-cool">Spotlight Cool</option>
                        <option value="floating">Floating</option>
                        <option value="dark">Dark</option>
                        <option value="light">Light</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Opacity <span class="control-value" id="orb-opacity-value">0.8</span></label>
                    <input type="range" id="orb-opacity-slider" min="0" max="1" step="0.05" value="0.8">
                </div>
                <div class="control-group">
                    <label>Contrast <span class="control-value" id="orb-contrast-value">1.0</span></label>
                    <input type="range" id="orb-contrast-slider" min="0.5" max="2.0" step="0.05" value="1.0">
                </div>
            </div>
            <button id="add-light-btn">+ New Light</button>
        </div>
        <canvas id="three-canvas"></canvas>
        <!-- <div class="hero-content">
            <h1>SHOE<br/>COMPANY</h1>
        </div> -->
    </header>

    <script type="module">
        // --- THREE.js Imports ---
        import * as THREE from 'three'; 
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        const windowWidth = window.innerWidth;
        const windowHeight = window.innerHeight;

        // --- Scene, Renderer, and Camera Setup ---
        const canvas = document.getElementById('three-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(windowWidth, windowHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        // Color management and tone mapping (matches model-viewer defaults)
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.VSMShadowMap;

        const scene = new THREE.Scene();
        scene.background = null;
        
        // Image-based lighting setup
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();
        
        // Default to RoomEnvironment
        const defaultEnvTexture = pmremGenerator.fromScene(new RoomEnvironment()).texture;
        scene.environment = defaultEnvTexture;

        // --- HDR Environment Loading ---
        const rgbeLoader = new RGBELoader();
        
        const hdrEnvironments = [
            { name: 'Studio (Default)', url: null },
            { name: 'Venice Sunset', url: 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/venice_sunset_1k.hdr' },
            { name: 'Kloppenheim', url: 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/kloppenheim_02_1k.hdr' },
            { name: 'Snowy Park', url: 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/snowy_park_01_1k.hdr' },
            { name: 'Brown Photostudio', url: 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/brown_photostudio_02_1k.hdr' },
            { name: 'Industrial Sunset', url: 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/industrial_sunset_puresky_1k.hdr' },
        ];

        const hdrSelector = document.getElementById('hdr-selector');
        
        // Populate HDR dropdown
        hdrEnvironments.forEach((env, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = env.name;
            hdrSelector.appendChild(option);
        });

        function loadHDREnvironment(url) {
            if (!url) {
                // Reset to default studio environment
                scene.environment = defaultEnvTexture;
                return;
            }

            rgbeLoader.load(url, (texture) => {
                const envMap = pmremGenerator.fromEquirectangular(texture).texture;
                scene.environment = envMap;
                texture.dispose();
            }, undefined, (error) => {
                console.error('Error loading HDR:', error);
            });
        }

        hdrSelector.addEventListener('change', (e) => {
            const selectedEnv = hdrEnvironments[e.target.value];
            if (selectedEnv) {
                loadHDREnvironment(selectedEnv.url);
            }
        });

        const camera = new THREE.PerspectiveCamera(45, windowWidth/windowHeight, 0.1, 1000);
        camera.position.z = 4;

        // --- Post-Processing Setup ---
        // Use multisampled render target for anti-aliasing
        const renderTarget = new THREE.WebGLRenderTarget(windowWidth, windowHeight, {
            samples: 4,  // MSAA samples
            type: THREE.HalfFloatType
        });
        const composer = new EffectComposer(renderer, renderTarget);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        // SSAO pass - Screen Space Ambient Occlusion for surface detail
        const ssaoPass = new SSAOPass(scene, camera, windowWidth, windowHeight);
        ssaoPass.kernelRadius = 28;
        ssaoPass.kernelSize = 64;  // More samples for quality
        ssaoPass.minDistance = 0.0005;
        ssaoPass.maxDistance = 0.25;
        ssaoPass.output = SSAOPass.OUTPUT.Default;
        composer.addPass(ssaoPass);

        // SSAO intensity multiplier shader
        const SSAOIntensityShader = {
            uniforms: {
                tDiffuse: { value: null },
                intensity: { value: 1.75 }  // Multiplier for SSAO darkness
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float intensity;
                varying vec2 vUv;
                void main() {
                    vec4 texel = texture2D(tDiffuse, vUv);
                    // Calculate luminance to detect darkened areas from SSAO
                    float lum = dot(texel.rgb, vec3(0.299, 0.587, 0.114));
                    // Amplify the darkening effect
                    vec3 darkened = texel.rgb * (1.0 - (1.0 - lum) * (intensity - 1.0) * 0.5);
                    gl_FragColor = vec4(darkened, texel.a);
                }
            `
        };
        const ssaoIntensityPass = new ShaderPass(SSAOIntensityShader);
        composer.addPass(ssaoIntensityPass);

        // Film grain shader - subtle noise to reduce banding and add luxe feel
        const FilmGrainShader = {
            uniforms: {
                tDiffuse: { value: null },
                time: { value: 0 },
                intensity: { value: 0.04 },  // Subtle grain intensity
                luminanceThreshold: { value: 0.8 }  // Reduce grain in highlights
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float time;
                uniform float intensity;
                uniform float luminanceThreshold;
                varying vec2 vUv;
                
                // High quality noise function
                float hash(vec2 p) {
                    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
                    p3 += dot(p3, p3.yzx + 33.33);
                    return fract((p3.x + p3.y) * p3.z);
                }
                
                void main() {
                    vec4 texel = texture2D(tDiffuse, vUv);
                    
                    // Calculate luminance
                    float lum = dot(texel.rgb, vec3(0.299, 0.587, 0.114));
                    
                    // Generate animated noise
                    vec2 noiseCoord = vUv * vec2(1920.0, 1080.0) + time * 100.0;
                    float noise = hash(noiseCoord) - 0.5;
                    
                    // Reduce grain in bright areas for a more natural look
                    float grainMask = 1.0 - smoothstep(luminanceThreshold - 0.2, luminanceThreshold + 0.2, lum);
                    
                    // Apply subtle grain
                    vec3 result = texel.rgb + noise * intensity * grainMask;
                    
                    gl_FragColor = vec4(result, texel.a);
                }
            `
        };
        const filmGrainPass = new ShaderPass(FilmGrainShader);
        composer.addPass(filmGrainPass);

        // Output pass for proper color space
        const outputPass = new OutputPass();
        composer.addPass(outputPass);

        // --- Lighting Configuration ---
        // With IBL environment, ambient light is mostly redundant.
        // Keep a very subtle fill if needed, but start at 0 to let IBL do the work.
        const ambientLight = new THREE.AmbientLight(0xffffff, 0);
        scene.add(ambientLight);
        
        // --- Floor (Shadow Catcher) and Scene Group Setup ---
        const shoeGroup = new THREE.Group();
        scene.add(shoeGroup);

        // --- Background Sphere with Procedural Gradients ---
        const orbGeometry = new THREE.SphereGeometry(25, 64, 64);
        const orbMaterial = new THREE.ShaderMaterial({
            uniforms: {
                map: { value: null },
                opacity: { value: 0.8 },
                contrast: { value: 1.0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D map;
                uniform float opacity;
                uniform float contrast;
                varying vec2 vUv;
                void main() {
                    vec4 texel = texture2D(map, vUv);
                    // Apply contrast: (color - 0.5) * contrast + 0.5
                    vec3 contrasted = clamp((texel.rgb - 0.5) * contrast + 0.5, 0.0, 1.0);
                    gl_FragColor = vec4(contrasted, texel.a * opacity);
                }
            `,
            side: THREE.BackSide,
            transparent: true,
            depthWrite: false
        });
        const orb = new THREE.Mesh(orbGeometry, orbMaterial);
        orb.renderOrder = -1000;  // Render behind everything
        shoeGroup.add(orb);
        
        // Gray background presets with optional spotlight effects
        const gradientPresets = {
            // base: background gray, spotlight: center glow color (null = no spotlight)
            // spotX/spotY: 0-1 position (default 0.5, 0.65 for center-bottom)
            // type: 'horizontal' for left-to-right gradient (uses left/mid/right instead of top/mid/bottom)
            studio:         { top: '#3a3a3a', mid: '#5a5a5a', bottom: '#e8e8e8', spotlight: null },
            'studio-inv':   { top: '#e8e8e8', mid: '#5a5a5a', bottom: '#3a3a3a', spotlight: null },
            spotlight:      { top: '#3a3a3a', mid: '#5a5a5a', bottom: '#7a7a7a', spotlight: '#ffffff' },
            'spotlight-warm': { top: '#3a3a3a', mid: '#5a5a5a', bottom: '#7a7a7a', spotlight: '#fff5e6' },
            'spotlight-cool': { top: '#3a3a3a', mid: '#5a5a5a', bottom: '#7a7a7a', spotlight: '#e6f0ff' },
            floating:       { type: 'horizontal', left: '#4a5568', mid: '#6b7a8a', right: '#8a9aaa', spotlight: '#b8c8d8', spotX: 0.85, spotY: 0.35, spotRadius: 0.5 },
            dark:           { top: '#1a1a1a', mid: '#2a2a2a', bottom: '#3a3a3a', spotlight: null },
            light:          { top: '#b0b0b0', mid: '#d0d0d0', bottom: '#f5f5f5', spotlight: null }
        };
        
        // Generate gradient texture with optional spotlight
        function generateGradientTexture(preset) {
            const canvas = document.createElement('canvas');
            // Wider canvas needed for spotlight or horizontal gradient
            canvas.width = (preset.spotlight || preset.type === 'horizontal') ? 512 : 2;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // Create gradient based on type
            let gradient;
            if (preset.type === 'horizontal') {
                // Horizontal gradient (left to right)
                gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
                gradient.addColorStop(0, preset.left);
                gradient.addColorStop(0.5, preset.mid);
                gradient.addColorStop(1, preset.right);
            } else {
                // Default vertical gradient (top to bottom)
                gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, preset.top);
                gradient.addColorStop(0.5, preset.mid);
                gradient.addColorStop(1, preset.bottom);
            }
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Add spotlight if specified
            if (preset.spotlight) {
                // Spotlight position (defaults to center-bottom area)
                const spotX = canvas.width * (preset.spotX ?? 0.5);
                const spotY = canvas.height * (preset.spotY ?? 0.65);
                const spotRadius = canvas.width * (preset.spotRadius ?? 0.6);
                
                const spotGradient = ctx.createRadialGradient(
                    spotX, spotY, 0,
                    spotX, spotY, spotRadius
                );
                spotGradient.addColorStop(0, preset.spotlight);
                spotGradient.addColorStop(0.3, preset.spotlight + 'aa');  // Semi-transparent
                spotGradient.addColorStop(1, 'transparent');
                
                ctx.fillStyle = spotGradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }
        
        function setBackgroundStyle(style) {
            if (!style || !gradientPresets[style]) {
                orbMaterial.uniforms.map.value = null;
                orb.visible = false;
                return;
            }
            
            const texture = generateGradientTexture(gradientPresets[style]);
            orbMaterial.uniforms.map.value = texture;
            orb.visible = true;
        }
        
        // Set default background
        setBackgroundStyle('studio');
        
        // Background controls
        const orbTextureSelector = document.getElementById('orb-texture-selector');
        const orbOpacitySlider = document.getElementById('orb-opacity-slider');
        const orbOpacityValue = document.getElementById('orb-opacity-value');
        
        orbTextureSelector.addEventListener('change', (e) => {
            setBackgroundStyle(e.target.value);
        });
        
        orbOpacitySlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            orbMaterial.uniforms.opacity.value = value;
            orbOpacityValue.textContent = value.toFixed(2);
        });
        
        // Contrast slider - only affects background
        const orbContrastSlider = document.getElementById('orb-contrast-slider');
        const orbContrastValue = document.getElementById('orb-contrast-value');
        
        orbContrastSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            orbMaterial.uniforms.contrast.value = value;
            orbContrastValue.textContent = value.toFixed(2);
        });

        const floorGeometry = new THREE.CircleGeometry(5, 64);
        const floorMaterial = new THREE.ShadowMaterial({
            transparent: true,
            opacity: 0.7,
            depthWrite: false  // Exclude from SSAO depth calculations
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.71;
        floor.receiveShadow = true;
        shoeGroup.add(floor);
        
        // Exclude floor and orb from SSAO by hiding them during SSAO's depth/normal render
        const originalSSAORender = ssaoPass.render.bind(ssaoPass);
        ssaoPass.render = function(renderer, writeBuffer, readBuffer, deltaTime, maskActive) {
            const orbWasVisible = orb.visible;
            floor.visible = false;
            orb.visible = false;
            originalSSAORender(renderer, writeBuffer, readBuffer, deltaTime, maskActive);
            floor.visible = true;
            orb.visible = orbWasVisible;
        };

        // --- Multi-Light Management System ---
        const lights = [];
        let lightIdCounter = 0;
        const lightRadius = 10;
        const controlsContainer = document.getElementById('controls-container');

        function createLight(options = {}) {
            const id = lightIdCounter++;
            const defaults = {
                intensity: 3.75,
                angle: 45 + (id * 90), // Spread lights around
                height: 7.07,
                color: '#ffffff',
                permanent: false // If true, light cannot be deleted
            };
            const config = { ...defaults, ...options };

            // Create Three.js light
            const light = new THREE.DirectionalLight(config.color, config.intensity);
            
            // Only the first light casts shadows to avoid multiple overlapping shadows
            const castsShadow = lights.length === 0;
            light.castShadow = castsShadow;
            
            light.target.position.set(0, -0.5, 0);
            shoeGroup.add(light.target);

            if (castsShadow) {
                light.shadow.mapSize.width = 2048;
                light.shadow.mapSize.height = 2048;
                light.shadow.radius = 32;
                light.shadow.bias = -0.005;
                light.shadow.blurSamples = 12;
                light.shadow.camera.near = 0.5;
                light.shadow.camera.far = 20;
                light.shadow.camera.left = -5;
                light.shadow.camera.right = 5;
                light.shadow.camera.top = 5;
                light.shadow.camera.bottom = -5;
            }

            shoeGroup.add(light);

            // Update light position
            function updatePosition() {
                const angleRad = (config.angle * Math.PI) / 180;
                light.position.set(
                    Math.cos(angleRad) * lightRadius,
                    config.height,
                    Math.sin(angleRad) * lightRadius
                );
            }
            updatePosition();

            // Create control panel
            const panel = document.createElement('div');
            panel.className = 'controls-panel';
            panel.id = `light-panel-${id}`;
            const deleteButton = config.permanent ? '' : `<button class="delete-light-btn" data-light-id="${id}">Delete</button>`;
            panel.innerHTML = `
                <h3>
                    ${config.permanent ? 'Main Light' : `Light ${id + 1}`}
                    ${deleteButton}
                </h3>
                <div class="control-group">
                    <label>Color</label>
                    <input type="color" class="light-color" value="${config.color}">
                </div>
                <div class="control-group">
                    <label>Intensity <span class="control-value intensity-value">${config.intensity.toFixed(1)}</span></label>
                    <input type="range" class="intensity-slider" min="0" max="20" step="0.1" value="${config.intensity}">
                </div>
                <div class="control-group">
                    <label>Angle <span class="control-value angle-value">${Math.round(config.angle)}</span>°</label>
                    <input type="range" class="angle-slider" min="0" max="360" step="1" value="${config.angle}">
                </div>
                <div class="control-group">
                    <label>Height <span class="control-value height-value">${config.height.toFixed(1)}</span></label>
                    <input type="range" class="height-slider" min="0" max="15" step="0.1" value="${config.height}">
                </div>
            `;

            // Add event listeners
            panel.querySelector('.light-color').addEventListener('input', (e) => {
                light.color.set(e.target.value);
            });

            panel.querySelector('.intensity-slider').addEventListener('input', (e) => {
                const value = parseFloat(e.target.value);
                light.intensity = value;
                panel.querySelector('.intensity-value').textContent = value.toFixed(1);
            });

            panel.querySelector('.angle-slider').addEventListener('input', (e) => {
                config.angle = parseFloat(e.target.value);
                panel.querySelector('.angle-value').textContent = Math.round(config.angle);
                updatePosition();
            });

            panel.querySelector('.height-slider').addEventListener('input', (e) => {
                config.height = parseFloat(e.target.value);
                panel.querySelector('.height-value').textContent = config.height.toFixed(1);
                updatePosition();
            });

            if (!config.permanent) {
                panel.querySelector('.delete-light-btn').addEventListener('click', () => {
                    deleteLight(id);
                });
            }

            // Insert panel after the "New Light" button
            const addButton = document.getElementById('add-light-btn');
            addButton.insertAdjacentElement('afterend', panel);

            // Store light data
            const lightData = { id, light, panel, config, updatePosition, permanent: config.permanent };
            lights.push(lightData);

            return lightData;
        }

        function deleteLight(id) {
            const index = lights.findIndex(l => l.id === id);
            if (index === -1) return;

            const lightData = lights[index];
            // Cannot delete permanent lights
            if (lightData.permanent) return;
            
            const wasShadowCaster = lightData.light.castShadow;
            
            // Remove from shoeGroup
            shoeGroup.remove(lightData.light);
            shoeGroup.remove(lightData.light.target);
            
            // Remove panel
            lightData.panel.remove();
            
            // Remove from array
            lights.splice(index, 1);
            
            // If we deleted the shadow caster, assign shadow casting to the next light
            if (wasShadowCaster && lights.length > 0) {
                const newShadowCaster = lights[0].light;
                newShadowCaster.castShadow = true;
                newShadowCaster.shadow.mapSize.width = 2048;
                newShadowCaster.shadow.mapSize.height = 2048;
                newShadowCaster.shadow.radius = 32;
                newShadowCaster.shadow.bias = -0.005;
                newShadowCaster.shadow.blurSamples = 12;
                newShadowCaster.shadow.camera.near = 0.5;
                newShadowCaster.shadow.camera.far = 20;
                newShadowCaster.shadow.camera.left = -5;
                newShadowCaster.shadow.camera.right = 5;
                newShadowCaster.shadow.camera.top = 5;
                newShadowCaster.shadow.camera.bottom = -5;
            }
        }

        // Add light button handler
        document.getElementById('add-light-btn').addEventListener('click', () => {
            createLight();
        });

        // Create permanent main light (cannot be deleted, needed for shadows)
        createLight({ intensity: 5.0, angle: 45, height: 7.0, color: '#ffffff', permanent: true });

        // --- 3D Model Loading and Configuration ---
        const loader = new GLTFLoader(); 
        let shoe;
        
        // Luxe entrance animation state
        let entranceAnimating = false;
        let entranceProgress = 0;
        const entranceDuration = 1.2; // seconds
        const finalScale = 8;
        const startScale = finalScale * 0.85;  // Start at 85%
        const startYOffset = -0.3;  // Start slightly below

        // --- Model Selection ---
        const models = [
            { name: 'NEW', file: './02_edited.glb' },
            { name: 'Orange', file: './02.glb' },
            { name: 'Yellow', file: './08.glb' },
            { name: 'Blue', file: './15.glb' },
            { name: 'Purple', file: './22.glb' },
        ];

        const modelSelector = document.getElementById('model-selector');

        // Populate dropdown
        models.forEach((model, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = model.name;
            modelSelector.appendChild(option);
        });

        function loadModel(filePath) {
            // Remove existing shoe if present
            if (shoe) {
                shoeGroup.remove(shoe);
                shoe.traverse(function(child) {
                    if (child.isMesh) {
                        child.geometry?.dispose();
                        child.material?.dispose();
                    }
                });
                shoe = null;
            }

            loader.load(filePath, function(gltf) {
                shoe = gltf.scene;
                shoe.scale.set(startScale, startScale, startScale);
                shoe.position.y = startYOffset;

                shoe.traverse(function(child) {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = false;
                        // Enable transparency for fade-in
                        if (child.material) {
                            child.material.transparent = true;
                            child.material.opacity = 0;
                        }
                    }
                });

                shoeGroup.add(shoe);
                entranceAnimating = true;
                entranceProgress = 0;
            }, undefined, function(error) {
                console.error('An error occurred loading the model:', error);
            });
        }

        // Handle dropdown change
        modelSelector.addEventListener('change', (e) => {
            const selectedModel = models[e.target.value];
            if (selectedModel) {
                loadModel(selectedModel.file);
            }
        });

        // Load initial model
        if (models.length > 0) {
            loadModel(models[0].file);
        }

        // --- Drag and Drop Model Loading ---
        const dragOverlay = document.createElement('div');
        dragOverlay.className = 'drag-overlay';
        dragOverlay.innerHTML = '<div class="drag-overlay-text">Drop GLB/GLTF or HDR to load</div>';
        document.body.appendChild(dragOverlay);

        let dragCounter = 0;

        document.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dragCounter++;
            dragOverlay.classList.add('active');
        });

        document.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dragCounter--;
            if (dragCounter === 0) {
                dragOverlay.classList.remove('active');
            }
        });

        document.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        document.addEventListener('drop', (e) => {
            e.preventDefault();
            dragCounter = 0;
            dragOverlay.classList.remove('active');

            const files = e.dataTransfer.files;
            if (files.length === 0) return;

            const file = files[0];
            const fileName = file.name.toLowerCase();
            
            // Handle HDR files
            if (fileName.endsWith('.hdr')) {
                const url = URL.createObjectURL(file);
                rgbeLoader.load(url, (texture) => {
                    const envMap = pmremGenerator.fromEquirectangular(texture).texture;
                    scene.environment = envMap;
                    texture.dispose();
                    URL.revokeObjectURL(url);
                    
                    // Update selector to show custom HDR
                    hdrSelector.value = '';
                    const customOption = hdrSelector.querySelector('option[value="custom"]');
                    if (!customOption) {
                        const opt = document.createElement('option');
                        opt.value = 'custom';
                        opt.textContent = `Custom: ${file.name}`;
                        opt.selected = true;
                        hdrSelector.appendChild(opt);
                    } else {
                        customOption.textContent = `Custom: ${file.name}`;
                        customOption.selected = true;
                    }
                }, undefined, (error) => {
                    console.error('Error loading dropped HDR:', error);
                    URL.revokeObjectURL(url);
                });
                return;
            }
            
            if (!fileName.endsWith('.glb') && !fileName.endsWith('.gltf')) {
                console.warn('Please drop a .glb, .gltf, or .hdr file');
                return;
            }

            const url = URL.createObjectURL(file);
            
            // Remove existing shoe
            if (shoe) {
                shoeGroup.remove(shoe);
                shoe.traverse(function(child) {
                    if (child.isMesh) {
                        child.geometry?.dispose();
                        child.material?.dispose();
                    }
                });
                shoe = null;
            }

            loader.load(url, function(gltf) {
                shoe = gltf.scene;
                shoe.scale.set(startScale, startScale, startScale);
                shoe.position.y = startYOffset;

                shoe.traverse(function(child) {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = false;
                        // Enable transparency for fade-in
                        if (child.material) {
                            child.material.transparent = true;
                            child.material.opacity = 0;
                        }
                    }
                });

                shoeGroup.add(shoe);
                entranceAnimating = true;
                entranceProgress = 0;
                
                // Clean up the object URL
                URL.revokeObjectURL(url);
                
                // Update selector to show custom model
                modelSelector.value = '';
                const customOption = modelSelector.querySelector('option[value="custom"]');
                if (!customOption) {
                    const opt = document.createElement('option');
                    opt.value = 'custom';
                    opt.textContent = `Custom: ${file.name}`;
                    opt.selected = true;
                    modelSelector.appendChild(opt);
                } else {
                    customOption.textContent = `Custom: ${file.name}`;
                    customOption.selected = true;
                }
            }, undefined, function(error) {
                console.error('Error loading dropped model:', error);
                URL.revokeObjectURL(url);
            });
        });

        // --- FPS Monitor Configuration ---
        let frameCount = 0;
        let lastFpsTime = performance.now();
        let currentFps = 60;
        const fpsCheckInterval = 1000; // Check FPS every second
        const lowFpsThreshold = 30;
        const lowFpsFrameCount = 3; // Number of consecutive low FPS readings before disabling shadows
        let consecutiveLowFpsCount = 0;
        let shadowsDisabled = false;

        function checkPerformance() {
            frameCount++;
            const now = performance.now();
            const elapsed = now - lastFpsTime;

            if (elapsed >= fpsCheckInterval) {
                currentFps = Math.round((frameCount * 1000) / elapsed);
                frameCount = 0;
                lastFpsTime = now;

                // Check if FPS is consistently low
                if (currentFps < lowFpsThreshold && !shadowsDisabled) {
                    consecutiveLowFpsCount++;
                    console.log(`Low FPS detected: ${currentFps} (${consecutiveLowFpsCount}/${lowFpsFrameCount})`);

                    if (consecutiveLowFpsCount >= lowFpsFrameCount) {
                        disableShadows();
                    }
                } else if (currentFps >= lowFpsThreshold) {
                    consecutiveLowFpsCount = 0;
                }
            }
        }

        function disableShadows() {
            console.log('Performance optimization: Disabling shadow maps');
            renderer.shadowMap.enabled = false;
            
            // Disable shadows on all lights
            lights.forEach(lightData => {
                lightData.light.castShadow = false;
            });
            
            floor.receiveShadow = false;

            if (shoe) {
                shoe.traverse(function(child) {
                    if (child.isMesh) {
                        child.castShadow = false;
                    }
                });
            }

            shadowsDisabled = true;
        }

        let isDragging = false;
        let previousX = 0;
        let previousY = 0;
        let autoRotate = true;
        let velocityX = 0;
        let velocityY = 0;
        
        // Luxe orbit controls settings
        const rotationSensitivity = 0.003;    // Slower rotation
        const autoRotateSpeed = 0.002;        // Slower auto-rotate
        const damping = 0.97;                 // Smoother deceleration
        const velocitySmoothing = 0.15;       // Smooth velocity accumulation
        let targetVelocityX = 0;
        let targetVelocityY = 0;
        const initialRotationY = 110 * Math.PI / 180; // Start at 110 degrees
        let currentRotationY = initialRotationY;
        let currentRotationX = 0;
        let targetRotationY = initialRotationY;
        let targetRotationX = 0;
        const rotationLerp = 0.08;            // Smooth interpolation factor

        function getClientXY(event) {
            if (event.type.startsWith('touch')) {
                return { x: event.touches[0].clientX, y: event.touches[0].clientY };
            } else {
                return { x: event.clientX, y: event.clientY };
            }
        }

        function onPointerDown(event) {
            isDragging = true;
            autoRotate = false;
            const { x, y } = getClientXY(event);
            previousX = x;
            previousY = y;
            // Reset velocities on new drag
            targetVelocityX = 0;
            targetVelocityY = 0;
        }

        function onPointerMove(event) {
            if (!isDragging || !shoeGroup) return;
            const { x, y } = getClientXY(event);
            const deltaX = x - previousX;
            const deltaY = y - previousY;
            
            // Accumulate target rotation for smooth interpolation
            targetRotationY += deltaX * rotationSensitivity;
            targetRotationX += deltaY * rotationSensitivity;
            
            // Clamp vertical rotation
            const maxVerticalAngle = Math.PI / 2.5; // ~72 degrees
            targetRotationX = Math.max(-maxVerticalAngle, Math.min(maxVerticalAngle, targetRotationX));
            
            // Smooth velocity for momentum
            targetVelocityX += (deltaX * rotationSensitivity - targetVelocityX) * velocitySmoothing;
            targetVelocityY += (deltaY * rotationSensitivity - targetVelocityY) * velocitySmoothing;
            
            previousX = x;
            previousY = y;
        }

        function onPointerUp() {
            isDragging = false;
            // Transfer accumulated velocity for momentum
            velocityX = targetVelocityX;
            velocityY = targetVelocityY;
        }

        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('mousemove', onPointerMove);
        canvas.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('mouseleave', onPointerUp);

        canvas.addEventListener('touchstart', onPointerDown, { passive: false });
        canvas.addEventListener('touchmove', onPointerMove, { passive: false });
        canvas.addEventListener('touchend', onPointerUp);

        // --- Zoom Controls ---
        const minZoom = 1;
        const maxZoom = 6;
        const zoomSpeed = 0.001;
        const zoomSlider = document.getElementById('zoom-slider');
        const zoomValue = document.getElementById('zoom-value');

        function updateZoom(value) {
            camera.position.z = Math.max(minZoom, Math.min(maxZoom, value));
            zoomSlider.value = camera.position.z;
            zoomValue.textContent = camera.position.z.toFixed(1);
        }

        zoomSlider.addEventListener('input', (e) => {
            updateZoom(parseFloat(e.target.value));
        });

        function onWheel(event) {
            event.preventDefault();
            const delta = event.deltaY * zoomSpeed;
            updateZoom(camera.position.z + delta);
        }

        canvas.addEventListener('wheel', onWheel, { passive: false });

        // Pinch zoom for touch devices
        let initialPinchDistance = null;
        let initialZoom = camera.position.z;

        canvas.addEventListener('touchstart', (event) => {
            if (event.touches.length === 2) {
                const dx = event.touches[0].clientX - event.touches[1].clientX;
                const dy = event.touches[0].clientY - event.touches[1].clientY;
                initialPinchDistance = Math.sqrt(dx * dx + dy * dy);
                initialZoom = camera.position.z;
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (event) => {
            if (event.touches.length === 2 && initialPinchDistance !== null) {
                event.preventDefault();
                const dx = event.touches[0].clientX - event.touches[1].clientX;
                const dy = event.touches[0].clientY - event.touches[1].clientY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const scale = initialPinchDistance / distance;
                updateZoom(initialZoom * scale);
            }
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            initialPinchDistance = null;
        });

        // --- FOV Slider ---
        const fovSlider = document.getElementById('fov-slider');
        const fovValue = document.getElementById('fov-value');

        fovSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            camera.fov = value;
            camera.updateProjectionMatrix();
            fovValue.textContent = Math.round(value);
        });

        // --- Exposure Slider (for flatter look) ---
        const exposureSlider = document.getElementById('exposure-slider');
        const exposureValue = document.getElementById('exposure-value');

        exposureSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            renderer.toneMappingExposure = value;
            exposureValue.textContent = value.toFixed(2);
        });

        // --- SSAO Slider ---
        const ssaoSlider = document.getElementById('ssao-slider');
        const ssaoValueEl = document.getElementById('ssao-value');

        ssaoSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            // Adjust SSAO parameters and intensity multiplier
            ssaoPass.kernelRadius = 16 + (value * 24);
            ssaoPass.maxDistance = 0.15 + (value * 0.2);
            ssaoPass.enabled = value > 0;
            ssaoIntensityPass.enabled = value > 0;
            ssaoIntensityPass.uniforms.intensity.value = 1.0 + (value * 1.5);  // 1.0 to 4.0
            ssaoValueEl.textContent = value.toFixed(1);
        });

        // SSAO debug toggle
        const ssaoDebug = document.getElementById('ssao-debug');
        let orbVisibleBeforeDebug = true;
        ssaoDebug.addEventListener('change', (e) => {
            ssaoPass.output = e.target.checked ? SSAOPass.OUTPUT.SSAO : SSAOPass.OUTPUT.Default;
            // Hide orb in debug mode to see SSAO on shoe clearly
            if (e.target.checked) {
                orbVisibleBeforeDebug = orb.visible;
                orb.visible = false;
            } else {
                orb.visible = orbVisibleBeforeDebug;
            }
        });

        // Expose for console debugging
        window.ssaoPass = ssaoPass;
        window.SSAOPass = SSAOPass;
        window.ssaoIntensityPass = ssaoIntensityPass;
        window.filmGrainPass = filmGrainPass;

        // --- Film Grain Slider ---
        const grainSlider = document.getElementById('grain-slider');
        const grainValue = document.getElementById('grain-value');

        grainSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            filmGrainPass.uniforms.intensity.value = value;
            filmGrainPass.enabled = value > 0;
            grainValue.textContent = value.toFixed(3);
        });

        function animate() {
            requestAnimationFrame(animate);
            checkPerformance();
            
            // Luxe auto-rotate (slower and smoother)
            if (shoe && autoRotate) {
                targetRotationY += autoRotateSpeed;
            }
            
            // Smooth momentum when not dragging
            if (!isDragging && (Math.abs(velocityX) > 0.00005 || Math.abs(velocityY) > 0.00005)) {
                targetRotationY += velocityX;
                targetRotationX += velocityY;
                
                // Clamp vertical rotation during momentum
                const maxVerticalAngle = Math.PI / 2.5;
                targetRotationX = Math.max(-maxVerticalAngle, Math.min(maxVerticalAngle, targetRotationX));
                
                velocityX *= damping;
                velocityY *= damping;
            }
            
            // Smooth interpolation for luxe feel
            currentRotationY += (targetRotationY - currentRotationY) * rotationLerp;
            currentRotationX += (targetRotationX - currentRotationX) * rotationLerp;
            
            // Apply smoothed rotations to shoeGroup (includes background sphere)
            shoeGroup.rotation.y = currentRotationY;
            shoeGroup.rotation.x = currentRotationX;
            
            // Update film grain time for animation
            filmGrainPass.uniforms.time.value = performance.now() * 0.001;
            
            // Luxe entrance animation
            if (shoe && entranceAnimating) {
                entranceProgress += 1 / 60 / entranceDuration; // Assuming ~60fps
                if (entranceProgress >= 1) {
                    entranceProgress = 1;
                    entranceAnimating = false;
                }
                
                // Ease-out cubic for smooth deceleration
                const eased = 1 - Math.pow(1 - entranceProgress, 3);
                
                // Animate scale
                const currentScale = startScale + (finalScale - startScale) * eased;
                shoe.scale.set(currentScale, currentScale, currentScale);
                
                // Animate position (rise up)
                shoe.position.y = startYOffset * (1 - eased);
                
                // Animate opacity
                shoe.traverse(function(child) {
                    if (child.isMesh && child.material) {
                        child.material.opacity = eased;
                    }
                });
            }
            composer.render();
        }
        animate();

        // --- Lighting Controls ---
        const directionalSlider = document.getElementById('directional-slider');
        const shadowSlider = document.getElementById('shadow-slider');
        const directionalValue = document.getElementById('directional-value');
        const shadowValue = document.getElementById('shadow-value');

        directionalSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            directionalLight.intensity = value;
            directionalValue.textContent = value.toFixed(1);
        });

        shadowSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            floorMaterial.opacity = value;
            shadowValue.textContent = value.toFixed(2);
        });

        const angleSlider = document.getElementById('angle-slider');
        const heightSlider = document.getElementById('height-slider');
        const angleValue = document.getElementById('angle-value');
        const heightValue = document.getElementById('height-value');

        angleSlider.addEventListener('input', (e) => {
            lightAngle = parseFloat(e.target.value);
            angleValue.textContent = Math.round(lightAngle);
            updateLightPosition();
        });

        heightSlider.addEventListener('input', (e) => {
            lightHeight = parseFloat(e.target.value);
            heightValue.textContent = lightHeight.toFixed(1);
            updateLightPosition();
        });

        // --- Window Resize ---
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            composer.setSize(width, height);
            ssaoPass.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>

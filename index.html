<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shoe</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/"
            }
        }
    </script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background: #f0f0f0;
        }
        .hero-header {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        #three-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: block;
            border-radius: 8px;
        }
        .hero-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            z-index: -1;
            text-align: center;
        }
        h1 {
            font-size: 25vw;
            font-family: monospace;
            line-height: 80%;
            color: grey;
        }
        #model-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            padding: 10px 15px;
            font-size: 16px;
            font-family: monospace;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
        }
        #model-selector:hover {
            background: rgba(255, 255, 255, 1);
        }
        #controls-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }
        .controls-panel {
            padding: 15px 20px;
            font-family: monospace;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #333;
            border-radius: 8px;
            min-width: 220px;
        }
        .controls-panel h3 {
            margin: 0 0 15px 0;
            font-size: 16px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .control-group {
            margin-bottom: 12px;
        }
        .control-group label {
            display: block;
            margin-bottom: 4px;
            color: #333;
        }
        .control-group input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .control-group input[type="color"] {
            width: 100%;
            height: 30px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
        }
        .control-value {
            float: right;
            font-weight: bold;
        }
        .delete-light-btn {
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 12px;
            font-family: monospace;
        }
        .delete-light-btn:hover {
            background: #cc0000;
        }
        #add-light-btn {
            padding: 10px 15px;
            font-size: 14px;
            font-family: monospace;
            background: #4CAF50;
            color: white;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
            width: fit-content;
        }
        #add-light-btn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <header class="hero-header">
        <select id="model-selector"></select>
        <div id="controls-container">
            <button id="add-light-btn">+ New Light</button>
            <div class="controls-panel" id="view-controls">
                <h3>View</h3>
                <div class="control-group">
                    <label>Zoom <span class="control-value" id="zoom-value">2.5</span></label>
                    <input type="range" id="zoom-slider" min="1" max="6" step="0.1" value="2.5">
                </div>
                <div class="control-group">
                    <label>Shadow Opacity <span class="control-value" id="shadow-value">0.7</span></label>
                    <input type="range" id="shadow-slider" min="0" max="1" step="0.05" value="0.7">
                </div>
            </div>
        </div>
        <canvas id="three-canvas"></canvas>
        <!-- <div class="hero-content">
            <h1>SHOE<br/>COMPANY</h1>
        </div> -->
    </header>

    <script type="module">
        // --- THREE.js Imports ---
        import * as THREE from 'three'; 
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const windowWidth = window.innerWidth;
        const windowHeight = window.innerHeight;

        // --- Scene, Renderer, and Camera Setup ---
        const canvas = document.getElementById('three-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(windowWidth, windowHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.VSMShadowMap;

        const scene = new THREE.Scene();
        scene.background = null;

        const camera = new THREE.PerspectiveCamera(75, windowWidth/windowHeight, 0.1, 1000);
        camera.position.z = 2.5;

        // --- Lighting Configuration ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
        ambientLight.intensity = 4.5;
        scene.add(ambientLight);
        
        // --- Floor (Shadow Catcher) and Scene Group Setup ---
        const shoeGroup = new THREE.Group();
        scene.add(shoeGroup);

        const floorGeometry = new THREE.CircleGeometry(5, 64);
        const floorMaterial = new THREE.ShadowMaterial({
            transparent: true,
            opacity: 0.7 
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.71;
        floor.receiveShadow = true;
        shoeGroup.add(floor);

        // --- Multi-Light Management System ---
        const lights = [];
        let lightIdCounter = 0;
        const lightRadius = 10;
        const controlsContainer = document.getElementById('controls-container');

        function createLight(options = {}) {
            const id = lightIdCounter++;
            const defaults = {
                intensity: 3.75,
                angle: 45 + (id * 90), // Spread lights around
                height: 7.07,
                color: '#ffffff'
            };
            const config = { ...defaults, ...options };

            // Create Three.js light
            const light = new THREE.DirectionalLight(config.color, config.intensity);
            
            // Only the first light casts shadows to avoid multiple overlapping shadows
            const castsShadow = lights.length === 0;
            light.castShadow = castsShadow;
            
            light.target.position.set(0, -0.5, 0);
            shoeGroup.add(light.target);

            if (castsShadow) {
                light.shadow.mapSize.width = 2048;
                light.shadow.mapSize.height = 2048;
                light.shadow.radius = 32;
                light.shadow.bias = -0.005;
                light.shadow.blurSamples = 12;
                light.shadow.camera.near = 0.5;
                light.shadow.camera.far = 20;
                light.shadow.camera.left = -5;
                light.shadow.camera.right = 5;
                light.shadow.camera.top = 5;
                light.shadow.camera.bottom = -5;
            }

            shoeGroup.add(light);

            // Update light position
            function updatePosition() {
                const angleRad = (config.angle * Math.PI) / 180;
                light.position.set(
                    Math.cos(angleRad) * lightRadius,
                    config.height,
                    Math.sin(angleRad) * lightRadius
                );
            }
            updatePosition();

            // Create control panel
            const panel = document.createElement('div');
            panel.className = 'controls-panel';
            panel.id = `light-panel-${id}`;
            panel.innerHTML = `
                <h3>
                    Light ${id + 1}
                    <button class="delete-light-btn" data-light-id="${id}">Delete</button>
                </h3>
                <div class="control-group">
                    <label>Color</label>
                    <input type="color" class="light-color" value="${config.color}">
                </div>
                <div class="control-group">
                    <label>Intensity <span class="control-value intensity-value">${config.intensity.toFixed(1)}</span></label>
                    <input type="range" class="intensity-slider" min="0" max="20" step="0.1" value="${config.intensity}">
                </div>
                <div class="control-group">
                    <label>Angle <span class="control-value angle-value">${Math.round(config.angle)}</span>°</label>
                    <input type="range" class="angle-slider" min="0" max="360" step="1" value="${config.angle}">
                </div>
                <div class="control-group">
                    <label>Height <span class="control-value height-value">${config.height.toFixed(1)}</span></label>
                    <input type="range" class="height-slider" min="0" max="15" step="0.1" value="${config.height}">
                </div>
            `;

            // Add event listeners
            panel.querySelector('.light-color').addEventListener('input', (e) => {
                light.color.set(e.target.value);
            });

            panel.querySelector('.intensity-slider').addEventListener('input', (e) => {
                const value = parseFloat(e.target.value);
                light.intensity = value;
                panel.querySelector('.intensity-value').textContent = value.toFixed(1);
            });

            panel.querySelector('.angle-slider').addEventListener('input', (e) => {
                config.angle = parseFloat(e.target.value);
                panel.querySelector('.angle-value').textContent = Math.round(config.angle);
                updatePosition();
            });

            panel.querySelector('.height-slider').addEventListener('input', (e) => {
                config.height = parseFloat(e.target.value);
                panel.querySelector('.height-value').textContent = config.height.toFixed(1);
                updatePosition();
            });

            panel.querySelector('.delete-light-btn').addEventListener('click', () => {
                deleteLight(id);
            });

            // Insert panel after the "New Light" button
            const addButton = document.getElementById('add-light-btn');
            addButton.insertAdjacentElement('afterend', panel);

            // Store light data
            const lightData = { id, light, panel, config, updatePosition };
            lights.push(lightData);

            return lightData;
        }

        function deleteLight(id) {
            const index = lights.findIndex(l => l.id === id);
            if (index === -1) return;

            const lightData = lights[index];
            const wasShadowCaster = lightData.light.castShadow;
            
            // Remove from shoeGroup
            shoeGroup.remove(lightData.light);
            shoeGroup.remove(lightData.light.target);
            
            // Remove panel
            lightData.panel.remove();
            
            // Remove from array
            lights.splice(index, 1);
            
            // If we deleted the shadow caster, assign shadow casting to the next light
            if (wasShadowCaster && lights.length > 0) {
                const newShadowCaster = lights[0].light;
                newShadowCaster.castShadow = true;
                newShadowCaster.shadow.mapSize.width = 2048;
                newShadowCaster.shadow.mapSize.height = 2048;
                newShadowCaster.shadow.radius = 32;
                newShadowCaster.shadow.bias = -0.005;
                newShadowCaster.shadow.blurSamples = 12;
                newShadowCaster.shadow.camera.near = 0.5;
                newShadowCaster.shadow.camera.far = 20;
                newShadowCaster.shadow.camera.left = -5;
                newShadowCaster.shadow.camera.right = 5;
                newShadowCaster.shadow.camera.top = 5;
                newShadowCaster.shadow.camera.bottom = -5;
            }
        }

        // Add light button handler
        document.getElementById('add-light-btn').addEventListener('click', () => {
            createLight();
        });

        // Create initial lights (designer settings)
        createLight({ intensity: 11.0, angle: 149, height: 9.0, color: '#ffffff' });
        createLight({ intensity: 5.0, angle: 320, height: 3.9, color: '#ffffff' });
        createLight({ intensity: 2.0, angle: 129, height: 0.0, color: '#ffffff' });

        // --- 3D Model Loading and Configuration ---
        const loader = new GLTFLoader(); 
        let shoe;
        let shoeScaleAnimating = false;
        let shoeScaleTarget = 8;
        let shoeScaleSpeed = 0.1;

        // --- Model Selection ---
        const models = [
            { name: 'Orange', file: './02.glb' },
            { name: 'Yellow', file: './08.glb' },
            { name: 'Blue', file: './15.glb' },
            { name: 'Purple', file: './22.glb' },
        ];

        const modelSelector = document.getElementById('model-selector');

        // Populate dropdown
        models.forEach((model, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = model.name;
            modelSelector.appendChild(option);
        });

        function loadModel(filePath) {
            // Remove existing shoe if present
            if (shoe) {
                shoeGroup.remove(shoe);
                shoe.traverse(function(child) {
                    if (child.isMesh) {
                        child.geometry?.dispose();
                        child.material?.dispose();
                    }
                });
                shoe = null;
            }

            loader.load(filePath, function(gltf) {
                shoe = gltf.scene;
                shoe.scale.set(0.01, 0.01, 0.01);

                shoe.traverse(function(child) {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = false;
                    }
                });

                shoeGroup.add(shoe);
                shoeScaleAnimating = true;
            }, undefined, function(error) {
                console.error('An error occurred loading the model:', error);
            });
        }

        // Handle dropdown change
        modelSelector.addEventListener('change', (e) => {
            const selectedModel = models[e.target.value];
            if (selectedModel) {
                loadModel(selectedModel.file);
            }
        });

        // Load initial model
        if (models.length > 0) {
            loadModel(models[0].file);
        }

        // --- FPS Monitor Configuration ---
        let frameCount = 0;
        let lastFpsTime = performance.now();
        let currentFps = 60;
        const fpsCheckInterval = 1000; // Check FPS every second
        const lowFpsThreshold = 30;
        const lowFpsFrameCount = 3; // Number of consecutive low FPS readings before disabling shadows
        let consecutiveLowFpsCount = 0;
        let shadowsDisabled = false;

        function checkPerformance() {
            frameCount++;
            const now = performance.now();
            const elapsed = now - lastFpsTime;

            if (elapsed >= fpsCheckInterval) {
                currentFps = Math.round((frameCount * 1000) / elapsed);
                frameCount = 0;
                lastFpsTime = now;

                // Check if FPS is consistently low
                if (currentFps < lowFpsThreshold && !shadowsDisabled) {
                    consecutiveLowFpsCount++;
                    console.log(`Low FPS detected: ${currentFps} (${consecutiveLowFpsCount}/${lowFpsFrameCount})`);

                    if (consecutiveLowFpsCount >= lowFpsFrameCount) {
                        disableShadows();
                    }
                } else if (currentFps >= lowFpsThreshold) {
                    consecutiveLowFpsCount = 0;
                }
            }
        }

        function disableShadows() {
            console.log('Performance optimization: Disabling shadow maps');
            renderer.shadowMap.enabled = false;
            
            // Disable shadows on all lights
            lights.forEach(lightData => {
                lightData.light.castShadow = false;
            });
            
            floor.receiveShadow = false;

            if (shoe) {
                shoe.traverse(function(child) {
                    if (child.isMesh) {
                        child.castShadow = false;
                    }
                });
            }

            shadowsDisabled = true;
        }

        let isDragging = false;
        let previousX = 0;
        let previousY = 0;
        let autoRotate = true;
        let velocityX = 0;
        let velocityY = 0;
        const damping = 0.95;

        function getClientXY(event) {
            if (event.type.startsWith('touch')) {
                return { x: event.touches[0].clientX, y: event.touches[0].clientY };
            } else {
                return { x: event.clientX, y: event.clientY };
            }
        }

        function onPointerDown(event) {
            isDragging = true;
            autoRotate = false;
            const { x, y } = getClientXY(event);
            previousX = x;
            previousY = y;
        }

        function onPointerMove(event) {
            if (!isDragging || !shoeGroup) return;
            const { x, y } = getClientXY(event);
            const deltaX = x - previousX;
            const deltaY = y - previousY;
            
            if (shoe) shoe.rotation.y += deltaX * 0.01;
            shoeGroup.rotation.x += deltaY * 0.01;
            velocityX = deltaX * 0.01;
            velocityY = deltaY * 0.01;
            
            previousX = x;
            previousY = y;
        }

        function onPointerUp() {
            isDragging = false;
        }

        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('mousemove', onPointerMove);
        canvas.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('mouseleave', onPointerUp);

        canvas.addEventListener('touchstart', onPointerDown, { passive: false });
        canvas.addEventListener('touchmove', onPointerMove, { passive: false });
        canvas.addEventListener('touchend', onPointerUp);

        // --- Zoom Controls ---
        const minZoom = 1;
        const maxZoom = 6;
        const zoomSpeed = 0.001;
        const zoomSlider = document.getElementById('zoom-slider');
        const zoomValue = document.getElementById('zoom-value');

        function updateZoom(value) {
            camera.position.z = Math.max(minZoom, Math.min(maxZoom, value));
            zoomSlider.value = camera.position.z;
            zoomValue.textContent = camera.position.z.toFixed(1);
        }

        zoomSlider.addEventListener('input', (e) => {
            updateZoom(parseFloat(e.target.value));
        });

        function onWheel(event) {
            event.preventDefault();
            const delta = event.deltaY * zoomSpeed;
            updateZoom(camera.position.z + delta);
        }

        canvas.addEventListener('wheel', onWheel, { passive: false });

        // Pinch zoom for touch devices
        let initialPinchDistance = null;
        let initialZoom = camera.position.z;

        canvas.addEventListener('touchstart', (event) => {
            if (event.touches.length === 2) {
                const dx = event.touches[0].clientX - event.touches[1].clientX;
                const dy = event.touches[0].clientY - event.touches[1].clientY;
                initialPinchDistance = Math.sqrt(dx * dx + dy * dy);
                initialZoom = camera.position.z;
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (event) => {
            if (event.touches.length === 2 && initialPinchDistance !== null) {
                event.preventDefault();
                const dx = event.touches[0].clientX - event.touches[1].clientX;
                const dy = event.touches[0].clientY - event.touches[1].clientY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const scale = initialPinchDistance / distance;
                updateZoom(initialZoom * scale);
            }
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            initialPinchDistance = null;
        });

        function animate() {
            requestAnimationFrame(animate);
            checkPerformance();
            if (shoe && autoRotate) {
                shoe.rotation.y += 0.01;
            }
            if (!isDragging && (Math.abs(velocityX) > 0.0001 || Math.abs(velocityY) > 0.0001)) {
                if (shoe) shoe.rotation.y += velocityX;
                shoeGroup.rotation.x += velocityY;
                velocityX *= damping;
                velocityY *= damping;
            }
            if (shoe && shoeScaleAnimating) {
                let current = shoe.scale.x;
                let next = Math.min(current + shoeScaleSpeed, shoeScaleTarget);
                shoe.scale.set(next, next, next);
                if (next >= shoeScaleTarget) {
                    shoe.scale.set(shoeScaleTarget, shoeScaleTarget, shoeScaleTarget);
                    shoeScaleAnimating = false;
                }
            }
            renderer.render(scene, camera);
        }
        animate();

        // --- Lighting Controls ---
        const directionalSlider = document.getElementById('directional-slider');
        const shadowSlider = document.getElementById('shadow-slider');
        const directionalValue = document.getElementById('directional-value');
        const shadowValue = document.getElementById('shadow-value');

        directionalSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            directionalLight.intensity = value;
            directionalValue.textContent = value.toFixed(1);
        });

        shadowSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            floorMaterial.opacity = value;
            shadowValue.textContent = value.toFixed(2);
        });

        const angleSlider = document.getElementById('angle-slider');
        const heightSlider = document.getElementById('height-slider');
        const angleValue = document.getElementById('angle-value');
        const heightValue = document.getElementById('height-value');

        angleSlider.addEventListener('input', (e) => {
            lightAngle = parseFloat(e.target.value);
            angleValue.textContent = Math.round(lightAngle);
            updateLightPosition();
        });

        heightSlider.addEventListener('input', (e) => {
            lightHeight = parseFloat(e.target.value);
            heightValue.textContent = lightHeight.toFixed(1);
            updateLightPosition();
        });

        // --- Window Resize ---
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
